# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8090

# ─── PostgreSQL (seed tables: vehicles, tax_reciprocity, fee_schedule, etc.) ─
spring.datasource.url=jdbc:postgresql://localhost:5433/mariondmv
spring.datasource.username=marion
spring.datasource.password=marion

# ─── Spring AI MCP server ────────────────────────────────────────────────────
spring.ai.mcp.server.name=marion-dmv-tools
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=STREAMABLE

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
