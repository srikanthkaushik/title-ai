# ─── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ─── PostgreSQL (main + pgvector) ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/mariondmv
spring.datasource.username=marion
spring.datasource.password=marion
spring.sql.init.mode=never

# pgvector store uses same credentials; declared separately for clarity
pgvector.host=localhost
pgvector.port=5433
pgvector.database=mariondmv
pgvector.username=marion
pgvector.password=marion

# ─── LLM provider (anthropic | ollama) ───────────────────────────────────────
llm.provider=ollama
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-sonnet-4-6
anthropic.max-tokens=4096

ollama.base-url=http://localhost:11434
ollama.chat-model=qwen2.5:7b
ollama.embed-model=nomic-embed-text

# ─── RAG ─────────────────────────────────────────────────────────────────────
# Retrieve this many candidates before reranking
rag.retrieve-multiplier=3
# Final top-K after reranking
rag.top-k=5

# ─── Corpus ──────────────────────────────────────────────────────────────────
corpus.base-path=C:/DEVL/TITLE/test-data/corpus

# ─── MCP server ──────────────────────────────────────────────────────────────
mcp.server.url=http://localhost:8090/mcp

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics
